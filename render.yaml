services:
  - type: web
    name: digital-payment-trend-analyzer
    env: python
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "gunicorn app:server --workers 1 --threads 2 --timeout 120"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0